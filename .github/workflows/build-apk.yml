---
name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Restore release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > /tmp/moggr-release.p12

      - name: Build signed release APK
        env:
          MOGGR_KEYSTORE_PATH: /tmp/moggr-release.p12
          MOGGR_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MOGGR_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MOGGR_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: /tmp/gradle-8.7/bin/gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Moggr-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moggr-${{ github.ref_name }}-apk
          path: Moggr-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Moggr-${{ github.ref_name }}.apk
          name: Moggr ${{ github.ref_name }}
          body: |
            Moggr for Android — free PSL face rating on the real 1–8 scale. Now with Moggr Coach.

            How it works: watch the intro, answer a few quick questions, then capture your face from 3 angles (front, left profile, right profile). The app measures 11 facial features on your phone — jawline, cheekbones, symmetry, FWHR, eye spacing, side profile and more — and rates you LTN / MTN / HTN / Chadlite / Chad, with a concrete softmaxxing roadmap. Then ask Moggr Coach anything, or send a photo for a full breakdown.

            100% free. No API key, no account, no paywall. The face scan is 100% on-device — no photo ever leaves your phone.

            Install: download the APK on your phone, open it, allow "install unknown apps" if asked.
            Note: v1.1 is signed with a new release key — uninstall any older MogScan build first.
---
